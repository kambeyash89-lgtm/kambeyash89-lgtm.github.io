<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallpaper Dukaan</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#09090b;color:#fff;font-family:Arial,sans-serif}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#09090b,#171717)}
.box{width:100%;max-width:390px;background:#151515;border:1px solid #333;border-radius:24px;padding:28px;box-shadow:0 20px 60px #000}
.logo{text-align:center;font-size:32px;font-weight:800;margin-bottom:8px}
.sub{text-align:center;color:#aaa;margin-bottom:25px}
input{width:100%;padding:15px;margin:8px 0;border-radius:12px;border:1px solid #444;background:#222;color:#fff;font-size:16px}
button{width:100%;padding:15px;border:0;border-radius:12px;background:#ff2020;color:#fff;font-size:17px;font-weight:700;margin-top:10px}
button:active{transform:scale(.98)}
.error{color:#ff5555;text-align:center;min-height:22px;margin-top:10px}
#app{display:none}
header{padding:24px 18px;background:linear-gradient(135deg,#151515,#09090b);border-bottom:1px solid #292929}
.title{font-size:30px;font-weight:800}
.tag{color:#aaa;margin-top:5px}
main{padding:18px;max-width:900px;margin:auto}
.section{background:#151515;border:1px solid #292929;border-radius:20px;padding:18px;margin-bottom:18px}
h2{margin-top:0}
.search{margin-bottom:15px}
.wallpapers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:#222;border-radius:16px;overflow:hidden}
.card img{width:100%;height:180px;object-fit:cover;display:block}
.card p{padding:10px;margin:0;color:#ddd}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions button{margin:0}
#cameraBox{display:none;margin-top:15px}
video{width:100%;border-radius:16px;background:#000}
.note{color:#999;font-size:13px;line-height:1.5}
.logout{background:#333}
@media(max-width:500px){
 .wallpapers{grid-template-columns:1fr 1fr}
 .card img{height:150px}
}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="box">
    <div class="logo">🖼️ Wallpaper Dukaan</div>
    <div class="sub">Private Wallpaper Gallery</div>

    <input id="username" type="text" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <div id="error" class="error"></div>
  </div>
</div>

<div id="app">
<header>
  <div class="title">🖼️ Wallpaper Dukaan</div>
  <div class="tag">Your personal wallpaper gallery</div>
</header>

<main>

<div class="section">
  <h2>📸 My Photos & Videos</h2>
  <div class="actions">
    <button onclick="document.getElementById('media').click()">📂 Choose Photos/Videos</button>
    <button onclick="startCamera()">📷 Camera</button>
  </div>

  <input id="media" type="file" accept="image/*,video/*" multiple style="display:none" onchange="showFiles(this.files)">

  <div id="cameraBox">
    <video id="video" autoplay playsinline></video>
    <button onclick="stopCamera()">Stop Camera</button>
  </div>

  <p class="note">
    Photos/videos are selected by you through the phone's normal picker.
    Camera access requires your browser's permission.
  </p>
  <div id="selected"></div>
</div>

<div class="section">
  <h2>🔎 Wallpapers</h2>
  <input class="search" id="search" type="text" placeholder="Search wallpapers..." oninput="filterWalls()">

  <div class="wallpapers" id="walls">
    <div class="card" data-name="nature">
      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80">
      <p>Nature</p>
    </div>
    <div class="card" data-name="night city">
      <img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=800&q=80">
      <p>Night City</p>
    </div>
    <div class="card" data-name="mountains">
      <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=800&q=80">
      <p>Mountains</p>
    </div>
    <div class="card" data-name="ocean">
      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80">
      <p>Ocean</p>
    </div>
  </div>
</div>

<div class="section">
  <h2>🎮 Game</h2>
  <button onclick="alert('Game section ready!')">Play Game</button>
  <button class="logout" onclick="logout()">Logout</button>
</div>

</main>
</div>

<script>
function login(){
  const u=document.getElementById("username").value.trim();
  const p=document.getElementById("password").value;

  if(u==="Yash Kamble" && p==="Yash123"){
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";
  }else{
    document.getElementById("error").textContent="Wrong username or password";
  }
}

function logout(){
  document.getElementById("app").style.display="none";
  document.getElementById("login").style.display="flex";
  document.getElementById("password").value="";
}

function showFiles(files){
  const out=document.getElementById("selected");
  out.innerHTML="";
  [...files].forEach(f=>{
    const p=document.createElement("p");
    p.textContent="✅ Selected: "+f.name;
    out.appendChild(p);
  });
}

async function startCamera(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:true});
    document.getElementById("video").srcObject=stream;
    document.getElementById("cameraBox").style.display="block";
  }catch(e){
    alert("Camera permission was denied or unavailable.");
  }
}

function stopCamera(){
  const v=document.getElementById("video");
  if(v.srcObject){
    v.srcObject.getTracks().forEach(t=>t.stop());
    v.srcObject=null;
  }
  document.getElementById("cameraBox").style.display="none";
}

function filterWalls(){
  const q=document.getElementById("search").value.toLowerCase();
  document.querySelectorAll("#walls .card").forEach(c=>{
    c.style.display=c.dataset.name.includes(q)?"block":"none";
  });
}
</script>

</body>
</html>
